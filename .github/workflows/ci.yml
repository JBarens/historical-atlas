name: ci
on:
  push:
  pull_request:
jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ci-not-used   # tests are mocked; the SDK client is only constructed
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: .github/workflows/*.yml
      - name: pytest (mocked pipeline)
        run: uv run -q --python 3.12 --with pytest --with anthropic --with python-dotenv --with fastembed --with numpy --with rank-bm25 python -m pytest backend/tests -q
      - name: gate self-tests (regression + stale-fingerprint paths)
        run: uv run -q --python 3.12 --with pytest --with anthropic --with python-dotenv --with fastembed --with numpy --with rank-bm25 python -m pytest eval/ci -q
      - name: fast retrieval gate (hybrid R@20 dev, zero tolerance)
        run: uv run -q --python 3.12 --with pytest --with anthropic --with python-dotenv --with fastembed --with numpy --with rank-bm25 python eval/ci/fast_gate.py
